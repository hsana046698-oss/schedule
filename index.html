<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>スケジュール通知</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10; --surface: #18181c; --surface2: #222228; --border: #2e2e38;
    --accent: #e8d5b0; --accent2: #b8a882; --text: #f0ece4; --text-dim: #888880;
    --text-muted: #555550; --today: #c8a96e; --tomorrow: #7eb8c8;
    --green: #7ec87e; --line-green: #06c755;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }

  .header { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; flex-direction: column; }
  .header-label { font-size: 10px; font-family: 'DM Mono', monospace; letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase; }
  .header-title { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; line-height: 1.2; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: all 0.15s; }
  .icon-btn:active { background: var(--surface2); transform: scale(0.95); }

  .date-bar { display: flex; justify-content: space-between; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .date-item { display: flex; align-items: center; gap: 6px; }
  .date-dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot-today { background: var(--today); } .dot-tomorrow { background: var(--tomorrow); }
  .date-text { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text-dim); }

  .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 14px 8px; border: none; background: transparent; color: var(--text-muted); font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; position: relative; }
  .tab::after { content: ''; position: absolute; bottom: 0; left: 20%; width: 60%; height: 2px; border-radius: 2px; background: transparent; transition: background 0.2s; }
  .tab.today.active { color: var(--today); } .tab.today.active::after { background: var(--today); }
  .tab.tomorrow.active { color: var(--tomorrow); } .tab.tomorrow.active::after { background: var(--tomorrow); }
  .tab.both.active { color: var(--accent); } .tab.both.active::after { background: var(--accent); }

  .scroll-area { padding: 16px 16px 220px; }

  .schedule-section { margin-bottom: 20px; }
  .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .section-badge { font-size: 11px; font-family: 'DM Mono', monospace; letter-spacing: 0.08em; padding: 4px 12px; border-radius: 20px; font-weight: 500; }
  .badge-today { background: rgba(200,169,110,0.15); color: var(--today); border: 1px solid rgba(200,169,110,0.3); }
  .badge-tomorrow { background: rgba(126,184,200,0.15); color: var(--tomorrow); border: 1px solid rgba(126,184,200,0.3); }
  .section-date { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  /* 時系列リスト */
  .timeline-block { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .timeline-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-bottom: 1px solid rgba(46,46,56,0.5); }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-left { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px; flex-shrink: 0; }
  .timeline-time { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent2); }
  .timeline-dot { width: 8px; height: 8px; border-radius: 50%; }
  .timeline-right { flex: 1; min-width: 0; }
  .timeline-source { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
  .source-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .timeline-title { font-size: 14px; line-height: 1.5; }
  .event-empty { padding: 20px; text-align: center; font-size: 13px; color: var(--text-muted); }

  .loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 48px; color: var(--text-muted); font-size: 13px; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg); border-top: 1px solid var(--border); padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 50; }
  .preview-toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
  .preview-toggle:active { background: var(--surface2); }
  .preview-toggle-label { font-size: 12px; color: var(--text-dim); font-family: 'DM Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; }
  .preview-arrow { font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
  .preview-arrow.open { transform: rotate(180deg); }
  .preview-content { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; max-height: 160px; overflow-y: auto; }
  .preview-content.open { display: block; }
  .preview-body { padding: 12px 14px; font-family: 'DM Mono', monospace; font-size: 11px; line-height: 1.9; color: var(--text-dim); white-space: pre-wrap; word-break: break-all; }
  .action-row { display: flex; gap: 8px; }
  .btn-copy { width: 52px; height: 52px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text-dim); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
  .btn-copy:active { transform: scale(0.94); }
  .btn-copy.copied { border-color: var(--green); color: var(--green); }
  .btn-line { flex: 1; height: 52px; background: var(--line-green); color: white; border: none; border-radius: 12px; font-family: 'Noto Sans JP', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s; }
  .btn-line:active { transform: scale(0.97); background: #05b04a; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 80; }
  .overlay.open { display: block; }
  .drawer { position: fixed; top: 0; right: -100%; width: 88%; max-width: 360px; height: 100%; background: var(--bg); border-left: 1px solid var(--border); z-index: 90; transition: right 0.3s ease; overflow-y: auto; padding: 0 0 48px; }
  .drawer.open { right: 0; }
  .drawer-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .drawer-title { font-size: 16px; font-weight: 700; color: var(--accent); }
  .drawer-close { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text-dim); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .drawer-section { padding: 20px; border-bottom: 1px solid var(--border); }
  .drawer-section-label { font-size: 10px; font-family: 'DM Mono', monospace; letter-spacing: 0.15em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }
  .input-field { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px; outline: none; margin-bottom: 8px; transition: border-color 0.2s; -webkit-appearance: none; }
  .input-field:focus { border-color: var(--accent2); }
  .input-field::placeholder { color: var(--text-muted); }
  .btn-add { width: 100%; padding: 13px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--accent); font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; margin-top: 4px; }
  .btn-add:active { background: var(--border); }

  .calendar-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .calendar-tag { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .cal-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .cal-info { flex: 1; min-width: 0; }
  .cal-name { font-size: 13px; font-weight: 500; }
  .cal-id { font-size: 10px; color: var(--text-muted); font-family: 'DM Mono', monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-remove { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px; flex-shrink: 0; }

  .color-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .color-opt { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; flex-shrink: 0; }
  .color-opt.selected { border-color: white; transform: scale(1.2); }

  .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .switch-row:last-child { border-bottom: none; }
  .switch-label { font-size: 13px; color: var(--text-dim); }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 24px; cursor: pointer; transition: 0.2s; }
  .slider:before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: var(--text-muted); border-radius: 50%; transition: 0.2s; }
  input:checked + .slider { background: rgba(200,169,110,0.2); border-color: var(--accent2); }
  input:checked + .slider:before { transform: translateX(18px); background: var(--accent); }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(40px); background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 20px; font-size: 12px; color: var(--text); transition: all 0.25s; z-index: 200; opacity: 0; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="header-label">Schedule</span>
    <span class="header-title">通知アプリ</span>
  </div>
  <div class="header-right">
    <div class="icon-btn" onclick="refreshData()">↻</div>
    <div class="icon-btn" onclick="openDrawer()">⚙</div>
  </div>
</div>

<div class="date-bar">
  <div class="date-item"><div class="date-dot dot-today"></div><span class="date-text" id="todayDate"></span></div>
  <div class="date-item"><div class="date-dot dot-tomorrow"></div><span class="date-text" id="tomorrowDate"></span></div>
</div>

<div class="tabs">
  <button class="tab today active" onclick="switchTab('today')">今日</button>
  <button class="tab tomorrow" onclick="switchTab('tomorrow')">明日</button>
  <button class="tab both" onclick="switchTab('both')">両方</button>
</div>

<div class="scroll-area" id="scheduleView"></div>

<div class="bottom-bar">
  <div class="preview-toggle" onclick="togglePreview()">
    <span class="preview-toggle-label">📋 LINE送信プレビュー</span>
    <span class="preview-arrow" id="previewArrow">▼</span>
  </div>
  <div class="preview-content" id="previewContent">
    <div class="preview-body" id="previewBody"></div>
  </div>
  <div class="action-row">
    <button class="btn-copy" id="copyBtn" onclick="copyText()">📋</button>
    <button class="btn-line" onclick="sendToLine()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
      LINEで送る
    </button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">設定</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-section">
    <div class="drawer-section-label">APIキー</div>
    <input type="password" class="input-field" id="apiKey" placeholder="AIza...">
    <div style="font-size:11px; color:var(--text-muted);">※ 未設定時はサンプル表示</div>
  </div>
  <div class="drawer-section">
    <div class="drawer-section-label">カレンダー登録</div>
    <input type="text" class="input-field" id="calName" placeholder="表示名（例：二宮）">
    <input type="text" class="input-field" id="calId" placeholder="カレンダーID">
    <input type="text" class="input-field" id="calMention" placeholder="LINEメンション（例：@二宮さん）空欄OK">
    <input type="text" class="input-field" id="calTag" placeholder="除去タグ（例：【NINO】）空欄OK">
    <div class="drawer-section-label" style="margin-top:4px; margin-bottom:6px;">色を選ぶ</div>
    <div class="color-row" id="colorPicker"></div>
    <button class="btn-add" onclick="addCalendar()">＋ 追加する</button>
    <div class="calendar-list" id="calendarList"></div>
  </div>
  <div class="drawer-section">
    <div class="drawer-section-label">送信オプション</div>
    <div class="switch-row">
      <span class="switch-label">ヘッダーを付ける</span>
      <label class="switch"><input type="checkbox" id="headerToggle" checked onchange="renderPreview()"><span class="slider"></span></label>
    </div>
    <div class="switch-row">
      <span class="switch-label">今日・明日を1通にまとめる</span>
      <label class="switch"><input type="checkbox" id="mergeToggle" onchange="renderPreview()"><span class="slider"></span></label>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const COLORS = ['#c8a96e','#7eb8c8','#7ec87e','#c87e7e','#b87ec8','#7e9bc8','#c8b47e','#7ec8b4','#c8877e','#a0a0c8'];
let selectedColor = COLORS[0];
let currentTab = 'today';
let calendars = [
  { name: '二宮', id: '', mention: '@二宮さん', tag: '【NINO】', color: '#c8a96e' },
  { name: '編集室ONE', id: '', mention: '', tag: '【ONE】', color: '#7eb8c8' },
  { name: '編集室TOP', id: '', mention: '', tag: '【TOP】', color: '#7ec87e' },
  { name: 'アン・グラント社内', id: '', mention: '', tag: '', color: '#b87ec8' },
  { name: 'アン・グラント案件', id: '', mention: '', tag: '', color: '#7e9bc8' },
];
let scheduleData = {};
let isLoading = false;

function formatDate(d) {
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getMonth()+1}/${d.getDate()}（${days[d.getDay()]}）`;
}
function updateDates() {
  const now = new Date(); const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
  document.getElementById('todayDate').textContent = '今日 ' + formatDate(now);
  document.getElementById('tomorrowDate').textContent = '明日 ' + formatDate(tomorrow);
}

// タグを除去してタイトルをきれいにする
function cleanTitle(title, tag) {
  if (!tag) return title;
  return title.replace(tag, '').trim();
}

function getSampleData() {
  return {
    '__sample__': {
      today: [
        { time: '10:00', title: '【NINO】クライアント打ち合わせ', calName: '二宮', color: '#c8a96e', mention: '@二宮さん', tag: '【NINO】' },
        { time: '13:00', title: '【ONE】撮影（外部案件）', calName: '編集室ONE', color: '#7eb8c8', mention: '', tag: '【ONE】' },
        { time: '13:00', title: '【NINO】撮影（スタジオA）', calName: '二宮', color: '#c8a96e', mention: '@二宮さん', tag: '【NINO】' },
        { time: '17:00', title: '【TOP】編集作業', calName: '編集室TOP', color: '#7ec87e', mention: '', tag: '【TOP】' },
        { time: '19:00', title: '【NINO】完パケ提出', calName: '二宮', color: '#c8a96e', mention: '@二宮さん', tag: '【NINO】' },
      ],
      tomorrow: [
        { time: '09:00', title: '【NINO】ロケハン', calName: '二宮', color: '#c8a96e', mention: '@二宮さん', tag: '【NINO】' },
        { time: '14:00', title: '【NINO】企画プレゼン', calName: '二宮', color: '#c8a96e', mention: '@二宮さん', tag: '【NINO】' },
        { time: '14:00', title: '【ONE】プレゼン用素材確認', calName: '編集室ONE', color: '#7eb8c8', mention: '', tag: '【ONE】' },
        { time: '18:00', title: 'スタッフMTG', calName: 'アン・グラント社内', color: '#b87ec8', mention: '', tag: '' },
      ]
    }
  };
}

async function fetchCalendar(apiKey, cal) {
  const d1 = new Date(); d1.setHours(0,0,0,0);
  const d2 = new Date(d1); d2.setDate(d1.getDate()+1);
  const d3 = new Date(d1); d3.setDate(d1.getDate()+2);
  const base = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?key=${apiKey}&singleEvents=true&orderBy=startTime`;
  try {
    const [r1, r2] = await Promise.all([
      fetch(`${base}&timeMin=${d1.toISOString()}&timeMax=${d2.toISOString()}`),
      fetch(`${base}&timeMin=${d2.toISOString()}&timeMax=${d3.toISOString()}`)
    ]);
    const [j1, j2] = await Promise.all([r1.json(), r2.json()]);
    const parse = items => (items||[]).map(e => ({
      time: e.start.dateTime ? new Date(e.start.dateTime).toLocaleTimeString('ja',{hour:'2-digit',minute:'2-digit'}) : '終日',
      title: e.summary || '（無題）',
      calName: cal.name, color: cal.color, mention: cal.mention, tag: cal.tag
    }));
    return { today: parse(j1.items), tomorrow: parse(j2.items) };
  } catch(e) { return null; }
}

async function refreshData() {
  isLoading = true; renderSchedule();
  const apiKey = document.getElementById('apiKey')?.value?.trim();
  if (!apiKey) {
    await new Promise(r => setTimeout(r, 400));
    scheduleData = getSampleData();
  } else {
    scheduleData = {};
    const activeCals = calendars.filter(c => c.id.trim());
    if (activeCals.length === 0) {
      showToast('カレンダーIDを登録してください');
      scheduleData = getSampleData();
    } else {
      const results = await Promise.all(activeCals.map(c => fetchCalendar(apiKey, c)));
      results.forEach((data, i) => {
        if (data) scheduleData[activeCals[i].id] = data;
        else showToast(`${activeCals[i].name}の取得に失敗しました`);
      });
    }
  }
  isLoading = false; renderSchedule(); renderPreview();
}

// 全イベントを時系列でまとめる
function getMergedTimeline(tab) {
  const apiKey = document.getElementById('apiKey')?.value?.trim();
  const isSample = !apiKey || Object.keys(scheduleData).includes('__sample__');

  let allEvents = [];
  if (isSample) {
    allEvents = scheduleData['__sample__']?.[tab] || [];
  } else {
    const activeCals = calendars.filter(c => c.id.trim());
    for (const cal of activeCals) {
      const events = scheduleData[cal.id]?.[tab] || [];
      allEvents = allEvents.concat(events);
    }
  }
  // 時刻でソート
  allEvents.sort((a, b) => {
    if (a.time === '終日') return -1;
    if (b.time === '終日') return 1;
    return a.time.localeCompare(b.time);
  });
  return allEvents;
}

function renderSchedule() {
  const view = document.getElementById('scheduleView');
  if (isLoading) { view.innerHTML = `<div class="loading"><div class="spinner"></div>読み込み中...</div>`; return; }

  const tabs = currentTab === 'both' ? ['today','tomorrow'] : [currentTab];
  let html = '';

  for (const tab of tabs) {
    const isToday = tab === 'today';
    const d = new Date(); if (!isToday) d.setDate(d.getDate()+1);
    html += `<div class="schedule-section"><div class="section-header"><span class="section-badge ${isToday?'badge-today':'badge-tomorrow'}">${isToday?'今日':'明日'}</span><span class="section-date">${formatDate(d)}</span></div>`;

    const events = getMergedTimeline(tab);
    if (events.length === 0) {
      html += `<div class="timeline-block"><div class="event-empty">スケジュールなし</div></div>`;
    } else {
      html += `<div class="timeline-block">`;
      for (const e of events) {
        const cleanedTitle = cleanTitle(e.title, e.tag);
        html += `<div class="timeline-item">
          <div class="timeline-left">
            <span class="timeline-time">${e.time}</span>
            <div class="timeline-dot" style="background:${e.color}"></div>
          </div>
          <div class="timeline-right">
            <div class="timeline-source">
              <div class="source-dot" style="background:${e.color}"></div>
              <span>${e.calName}${e.mention ? ' · ' + e.mention : ''}</span>
            </div>
            <div class="timeline-title">${cleanedTitle}</div>
          </div>
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  view.innerHTML = html;
}

function renderPreview() {
  const showHeader = document.getElementById('headerToggle')?.checked;
  const merge = document.getElementById('mergeToggle')?.checked;

  const buildText = (tab) => {
    const isToday = tab === 'today';
    const d = new Date(); if (!isToday) d.setDate(d.getDate()+1);
    let text = '';
    if (showHeader) text += `【${isToday?'今日':'明日'}のスケジュール ${formatDate(d)}】\n\n`;

    const events = getMergedTimeline(tab);
    if (events.length === 0) return text + 'スケジュールなし';

    for (const e of events) {
      const cleanedTitle = cleanTitle(e.title, e.tag);
      const mentionPart = e.mention ? `${e.mention} ` : '';
      text += `${e.time} ${mentionPart}${cleanedTitle}\n`;
    }
    return text.trimEnd();
  };

  document.getElementById('previewBody').textContent =
    (currentTab === 'both' || merge) ? buildText('today') + '\n\n' + buildText('tomorrow') : buildText(currentTab);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => { t.classList.remove('active'); if (['today','tomorrow','both'][i] === tab) t.classList.add('active'); });
  renderSchedule(); renderPreview();
}
function togglePreview() {
  document.getElementById('previewContent').classList.toggle('open');
  document.getElementById('previewArrow').classList.toggle('open');
}
function sendToLine() {
  window.open(`https://line.me/R/share?text=${encodeURIComponent(document.getElementById('previewBody').textContent)}`, '_blank');
}
function copyText() {
  navigator.clipboard.writeText(document.getElementById('previewBody').textContent).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓'; btn.classList.add('copied');
    showToast('コピーしました！');
    setTimeout(() => { btn.textContent = '📋'; btn.classList.remove('copied'); }, 2000);
  });
}
function openDrawer() { document.getElementById('drawer').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

function addCalendar() {
  const name = document.getElementById('calName').value.trim();
  const id = document.getElementById('calId').value.trim();
  const mention = document.getElementById('calMention').value.trim();
  const tag = document.getElementById('calTag').value.trim();
  if (!name || !id) { showToast('名前とカレンダーIDを入力してください'); return; }
  calendars.push({ name, id, mention, tag, color: selectedColor });
  document.getElementById('calName').value = '';
  document.getElementById('calId').value = '';
  document.getElementById('calMention').value = '';
  document.getElementById('calTag').value = '';
  renderCalendarList();
  showToast(`${name}を追加しました`);
}
function removeCalendar(i) {
  if (calendars.length <= 1) { showToast('最低1つ必要です'); return; }
  const name = calendars[i].name;
  calendars.splice(i, 1);
  renderCalendarList(); renderSchedule(); renderPreview();
  showToast(`${name}を削除しました`);
}
function renderCalendarList() {
  document.getElementById('calendarList').innerHTML = calendars.map((c, i) =>
    `<div class="calendar-tag">
      <div class="cal-dot" style="background:${c.color}"></div>
      <div class="cal-info">
        <div class="cal-name">${c.name}${c.tag ? ' <span style="font-size:10px;color:var(--today)">'+c.tag+'</span>' : ''}</div>
        <div class="cal-id">${c.id || '（IDなし・サンプル表示中）'}</div>
      </div>
      <button class="cal-remove" onclick="removeCalendar(${i})">×</button>
    </div>`
  ).join('');
}
function renderColorPicker() {
  document.getElementById('colorPicker').innerHTML = COLORS.map(c =>
    `<div class="color-opt ${c === selectedColor ? 'selected' : ''}" style="background:${c}" onclick="selectColor('${c}')"></div>`
  ).join('');
}
function selectColor(color) { selectedColor = color; renderColorPicker(); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

updateDates();
renderColorPicker();
renderCalendarList();
scheduleData = getSampleData();
renderSchedule();
renderPreview();
setInterval(updateDates, 60000);
</script>
